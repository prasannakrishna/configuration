spring:
  application:
    name: authService
  datasource:
    url: jdbc:postgresql://postgres:5432/authdb
    username: commart
    password: commart123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: authService-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: \"*\"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/scm

server:
  port: 8097

eureka:
  client:
    enabled: false

spring.cloud.config.fail-fast: false

keycloak:
  server-url: http://keycloak:8080
  realm: scm
  client-id: scm-backend
  client-secret: JWNcEsWwB55seZR4nYd4feW0AD7o1A7g

userservice:
  base-url: http://user-service:8087
